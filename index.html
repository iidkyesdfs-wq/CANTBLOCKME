<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click to Continue</title>

  <style>
    /* ---------- Base ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0f19;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.25), transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(236, 72, 153, 0.22), transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(34, 211, 238, 0.18), transparent 50%);
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: pointer;          /* whole page is clickable */
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ---------- Card ---------- */
    .card {
      position: relative;
      text-align: center;
      padding: 56px 40px;
      max-width: 440px;
      width: 100%;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    body:hover .card {
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.65),
        0 0 60px rgba(99, 102, 241, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* ---------- Glowing ring ---------- */
    .ring {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.55);
    }

    .ring::before,
    .ring::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid rgba(139, 92, 246, 0.55);
      animation: pulse 2.4s ease-out infinite;
    }

    .ring::after {
      animation-delay: 1.2s;
    }

    .ring svg {
      width: 44px;
      height: 44px;
      stroke: #fff;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- Text ---------- */
    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    p {
      font-size: 0.98rem;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 28px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 30px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
      background-size: 200% 200%;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.45);
      animation: shimmer 4s ease infinite;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    body:hover .cta {
      transform: scale(1.04);
      box-shadow: 0 14px 40px rgba(236, 72, 153, 0.5);
    }

    .hint {
      margin-top: 22px;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #64748b;
    }

    .hint span {
      animation: blink 1.8s ease-in-out infinite;
    }

    /* ---------- Animations ---------- */
    @keyframes pulse {
      0%   { transform: scale(0.85); opacity: 0.9; }
      100% { transform: scale(1.55); opacity: 0; }
    }

    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (max-width: 480px) {
      .card { padding: 44px 24px; }
      h1 { font-size: 1.35rem; }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="ring">
      <!-- arrow icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 17 17 7" />
        <path d="M8 7h9v9" />
      </svg>
    </div>

    <h1>You're one click away</h1>
    <p>Tap anywhere on this page and we'll take you straight to the site.</p>

    <!-- Real link = works even if JavaScript is disabled -->
    <a class="cta" href="https://shorturl.at/93Xk0">Take me there →</a>

    <div class="hint">Click anywhere <span>•</span></div>
  </main>

  <script>
    const DESTINATION = "https://shorturl.at/93Xk0";

    // Guard so we only redirect once
    let redirected = false;

    function go() {
      if (redirected) return;
      redirected = true;
      window.location.href = DESTINATION;
    }

    // Click anywhere on the page
    document.addEventListener("click", go);

    // Keyboard support (Enter or Space)
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        go();
      }
    });

    // Touch support
    document.addEventListener("touchend", go, { passive: true });

    /* ---------------------------------------------------
       OPTIONAL: auto-redirect after N seconds.
       Uncomment the line below to enable a 5s auto-redirect.
       --------------------------------------------------- */
    // setTimeout(go, 5000);
  </script>
</body>
</html>
